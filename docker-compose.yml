# docker-compose.yml — boop-agent VPS deployment.
#
# Targets a host that already runs Traefik with the `traefik-public` external
# network and Let's Encrypt automation (the typical OVH / Hetzner / Contabo
# Ubuntu 24.04 layout). All Traefik names are prefixed `boop-` to avoid
# collisions with other projects on the same Traefik.
#
# Two networks:
#   * boop-net           — internal-only. boop-agent ↔ boop-whisper.
#   * traefik-public     — external, optional. Only attached to boop-agent
#                          when you actually need an inbound public URL
#                          (Composio webhook, or TELEGRAM_MODE=webhook).
#                          Polling-mode Telegram needs no public URL at all.
#
# Bring up:
#   docker compose up -d --build
# Tail logs:
#   docker compose logs -f boop
# Stop:
#   docker compose down

name: boop

services:
  boop:
    container_name: boop-agent
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.local
    environment:
      # Voice transcription router. The Node code in server/whisper.ts picks
      # Groq whisper-large-v3 first (when GROQ_API_KEY is set in .env.local)
      # and falls back to the local sidecar at WHISPER_URL on Groq errors.
      # GROQ_API_KEY is intentionally NOT listed here — values under
      # `environment:` override values in `env_file:`, and ${GROQ_API_KEY:-}
      # would resolve against the host shell (usually empty), silently
      # blanking the .env.local value. WHISPER_URL is overridden because it
      # has a Docker-specific DNS name that differs from local dev.
      WHISPER_URL: http://whisper:9000/transcribe
      NODE_ENV: production
      PORT: "3456"
    networks:
      - boop-net
      # Comment the next line out if you don't need any public route at all.
      - traefik-public
    depends_on:
      whisper:
        condition: service_started
    # mem_limit intentionally absent: the Node runtime + the local embeddings
    # model (~440 MB) + the spawned Claude CLI subprocess together peak well
    # above 2 GB during a busy turn. A hard cap silently OOM-kills the
    # container without leaving anything in the logs. Trust the host (typical
    # 4–8 GB VPS) and rely on Linux's overall pressure to evict if needed.
    cpus: 2.0
    labels:
      # ---- Traefik wiring ---------------------------------------------------
      # Disabled by default. Set BOOP_PUBLIC_HOST in your shell or .env
      # (docker-compose interpolates from the host env, NOT from .env.local)
      # and uncomment the routers you actually need before bringing the stack
      # up. Polling Telegram + no Composio = leave everything below disabled.
      - traefik.enable=false
      - traefik.docker.network=traefik-public

      # Composio webhook receiver — only needed if you use Composio for
      # proactive Gmail. Reachable at https://${BOOP_PUBLIC_HOST}/composio/webhook.
      # - traefik.enable=true
      # - traefik.http.routers.boop-router-composio.rule=Host(`${BOOP_PUBLIC_HOST}`) && PathPrefix(`/composio/webhook`)
      # - traefik.http.routers.boop-router-composio.entrypoints=websecure
      # - traefik.http.routers.boop-router-composio.tls=true
      # - traefik.http.routers.boop-router-composio.tls.certresolver=letsencrypt
      # - traefik.http.routers.boop-router-composio.service=boop-svc
      # - traefik.http.routers.boop-router-composio.priority=20

      # Telegram webhook receiver — only needed when TELEGRAM_MODE=webhook.
      # Polling mode is the default and needs no public URL.
      # - traefik.http.routers.boop-router-telegram.rule=Host(`${BOOP_PUBLIC_HOST}`) && PathPrefix(`/telegram/webhook`)
      # - traefik.http.routers.boop-router-telegram.entrypoints=websecure
      # - traefik.http.routers.boop-router-telegram.tls=true
      # - traefik.http.routers.boop-router-telegram.tls.certresolver=letsencrypt
      # - traefik.http.routers.boop-router-telegram.service=boop-svc
      # - traefik.http.routers.boop-router-telegram.priority=20

      # Backend service definition (shared by both routers above).
      # - traefik.http.services.boop-svc.loadbalancer.server.port=3456

  whisper:
    container_name: boop-whisper
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Pick a model that fits your VPS. medium peaks ~2.5GB RAM and runs
      # ~2x realtime on 4 vCPU; large-v3 needs ~5GB and runs slower.
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      # Leave WHISPER_LANGUAGE blank to autodetect per request.
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
    networks:
      # Whisper is intentionally NOT on traefik-public. Only boop reaches
      # it via boop-net.
      - boop-net
    volumes:
      - whisper-cache:/models
    # whisper-medium with int8 peaks ~900 MB at runtime, but model loading
    # briefly spikes; 4 GB headroom keeps the OOM killer away from edge cases
    # like a sudden burst of long voice notes.
    mem_limit: 4000m
    cpus: 2.0

networks:
  boop-net:
    driver: bridge
    internal: false  # boop-net allows the boop container to reach the
                     # outside world (Telegram, Convex, etc.). The whisper
                     # container is still inaccessible from outside the
                     # host because nothing maps its port.
  traefik-public:
    external: true

volumes:
  whisper-cache:
    name: boop-whisper-cache
